name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - '**.md'
      - 'demo.tape'
  pull_request:
    paths-ignore:
      - 'assets/**'
      - '**.md'
      - 'demo.tape'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings